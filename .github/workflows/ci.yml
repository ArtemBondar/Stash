name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_call:
    inputs:
      upload_release_artifacts:
        type: boolean
        default: false

permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: '1'

jobs:
  android:
    name: JVM tests and Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: ./kotlin test -p jvm
      - run: ./kotlin build -p android
      - name: Upload Android debug APK
        if: inputs.upload_release_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug
          path: build/tasks/_androidApp_buildAndroidDebug/gradle-project-debug.apk
          if-no-files-found: error
          overwrite: true

  ios:
    name: iOS simulator tests and build
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: ./kotlin test -m shared -p iosSimulatorArm64
      - run: ./kotlin build -p iosSimulatorArm64
      - name: Package iOS simulator app
        if: inputs.upload_release_artifacts
        run: ditto -c -k --keepParent build/tasks/_iosApp_buildIosAppIosSimulatorArm64Debug/bin/Debug-iphonesimulator/Stash.app ios-simulator.zip
      - name: Upload iOS simulator app
        if: inputs.upload_release_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator
          path: ios-simulator.zip
          if-no-files-found: error
          overwrite: true
