name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example, v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate branch and version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$RELEASE_REF" != refs/heads/main ]]; then
            echo 'Draft releases must be dispatched from main.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Version must have the form vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      upload_release_artifacts: true
    permissions:
      contents: read

  draft:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          # Listing releases with write access includes drafts without tags.
          existing_release=$(gh api --paginate "repos/$REPOSITORY/releases?per_page=100" |
            jq -r --arg version "$RELEASE_VERSION" '.[] | select(.tag_name == $version) | .id')
          if [[ -n "$existing_release" ]]; then
            echo "Release $RELEASE_VERSION already exists; refusing to modify it." >&2
            exit 1
          fi
          # Refuse existing tags as well, including on a rerun.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null || status=$?
          if [[ "$status" -eq 0 ]]; then
            echo "Tag $RELEASE_VERSION already exists; refusing to modify it." >&2
            exit 1
          elif [[ "$status" -ne 2 ]]; then
            echo 'Could not check for an existing tag.' >&2
            exit "$status"
          fi
          gh release create "$RELEASE_VERSION" \
            artifacts/android-debug/gradle-project-debug.apk \
            artifacts/ios-simulator/ios-simulator.zip \
            --target "$RELEASE_COMMIT" --title "Stash $RELEASE_VERSION" --draft \
            --notes 'Includes an Android debug APK and an iOS simulator build for testing.'
