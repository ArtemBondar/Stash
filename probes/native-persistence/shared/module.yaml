product:
  type: kmp/lib
  platforms: [jvm, iosSimulatorArm64]

dependencies:
  - androidx.room3:room3-runtime:3.0.3
  - androidx.sqlite:sqlite-bundled:2.7.1

settings:
  kotlin:
    ksp:
      processors:
        - androidx.room3:room3-compiler:3.0.3

settings@jvm:
  kotlin:
    ksp:
      processorOptions:
        room.schemaLocation: ./schemas@jvm
settings@iosSimulatorArm64:
  kotlin:
    ksp:
      processorOptions:
        room.schemaLocation: ./schemas@iosSimulatorArm64
